services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: linkmind_user
      POSTGRES_PASSWORD: linkmind_password
      POSTGRES_DB: linkmind_db
    volumes:
      - linkmind-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkmind_user -d linkmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  linkmind-data:
